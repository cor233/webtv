name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Same host Python Chaquopy needs, without the deadsnakes PPA: its Launchpad
      # signing key can be unavailable for hours and would redden main for no reason.
      - name: Set up host Python 3.10 (Chaquopy v17 buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Expose python3.10 for Chaquopy buildPython
        run: |
          PYTHON_DIR="$(dirname "$(command -v python)")"
          command -v python3.10 >/dev/null || ln -sf "$(command -v python)" "$PYTHON_DIR/python3.10"
          python3.10 --version
          python3.10 -m venv --help >/dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug variants only: release needs the signing keystore, and a broken main
      # branch should not depend on secrets being present.
      - name: Compile TV and mobile
        run: |
          ./gradlew --no-daemon \
            :app:compileLeanbackArm64_v8aDebugJavaWithJavac \
            :app:compileMobileArm64_v8aDebugJavaWithJavac \
            :catvod:compileDebugJavaWithJavac

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testLeanbackArm64_v8aDebugUnitTest :app:testMobileArm64_v8aDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
